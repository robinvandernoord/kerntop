[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[project]
name = "kerntop"
version = "0.1.2"
description = "A safe terminal UI for managing Linux kernels on apt-based systems"
readme = "README.md"
license = "MIT"
keywords = ["apt", "debian", "kernel", "linux", "terminal", "tui", "ubuntu"]
authors = [
    { name = "Robin van der Noord", email = "robinvandernoord@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.80.0",
]

[project.urls]
Homepage = "https://github.com/robinvandernoord/kerntop"
Repository = "https://github.com/robinvandernoord/kerntop"
Issues = "https://github.com/robinvandernoord/kerntop/issues"

[project.scripts]
kerntop = "kerntop:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "su6[all]",
]

[tool.su6]
directory = "src"
stop-after-first-failure = true
coverage = 75

[tool.coverage.run]
omit = ["src/kerntop/app.py", "src/kerntop/screens/*"]

[tool.vommit]
allow_breaking_bang = true
allow_breaking_footer = true
prerelease_token = "rc"
confirm = true

[tool.vommit.git]
enabled = true
origin = "origin"
branch = "master"
on_wrong_branch = "error"
tag_format = "v{version}"
commit_format = "{version}"

[tool.vommit.changelog]
enabled = true
file = "CHANGELOG.md"
include_prereleases = false
placeholder = "<!--next-version-placeholder-->"
placeholder_regex = "^<!\\-\\-[ \\t]*next\\-version\\-placeholder[ \\t]*\\-\\->$"
entry_title_format = "## v{version} ({date:%Y-%m-%d})"

[tool.vommit.changelog.levels]
break = "Breaking Change{s}"
feat = "Feature{s}"
fix = "Fix{es}"
perf = "Performance"
docs = "Documentation"

[tool.vommit.pypi]
enabled = true
use_keyring = true

[tool.vommit.commands]
clean = "rm -rf ./dist"
build = "uv build"
publish = "uv publish"
post_publish = ""

[tool.vommit.version_bump_map]
break = "major"
feat = "minor"
fix = "patch"
perf = "patch"
